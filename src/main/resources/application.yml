spring:
  application:
    name: DupeLens
  main:
    headless: true
  datasource:
    url: jdbc:sqlite:./data/dupelens.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
      connection-init-sql: PRAGMA busy_timeout=5000
  sql:
    init:
      mode: always
  thymeleaf:
    cache: false
server:
  port: 8080
  error:
    include-message: always
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
logging:
  level:
    uk.co.dupelens: INFO
