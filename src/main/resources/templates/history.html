<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>History · DupeLens</title><link rel="stylesheet" href="/css/app.css"></head><body>
<header class="topbar"><div class="shell nav"><a class="brand" href="/"><span class="brandmark">◎</span>DupeLens</a><nav class="navlinks"><a href="/">Dashboard</a><a href="/results">Duplicates</a><a class="active" href="/history">History</a><a href="/settings">Settings</a></nav></div></header>
<main class="shell"><div class="section-title"><div><div class="eyebrow">Audit trail</div><h1 style="margin:.3rem 0">Scan history</h1></div><a class="btn primary" href="/">New scan</a></div><section class="panel"><div th:if="${#lists.isEmpty(history)}" class="empty">No scan history yet.</div><div style="overflow:auto"><table th:if="${!#lists.isEmpty(history)}" class="history-table"><thead><tr><th>Scan</th><th>Started</th><th>Status</th><th>Files</th><th>Exact groups</th><th>Similar images</th><th>Similar videos</th><th>AI groups</th><th>Reclaimable</th></tr></thead><tbody><tr th:each="h:${history}"><td th:text="${'#'+h.id}">#1</td><td th:text="${h.started_at}">date</td><td th:text="${h.status}">done</td><td th:text="${h.files_seen}">0</td><td th:text="${h.duplicate_groups}">0</td><td th:text="${h.similar_image_groups}">0</td><td th:text="${h.similar_video_groups}">0</td><td th:text="${h.ai_groups}">0</td><td th:text="${@fmt.bytes(h.reclaimable_bytes)}">0 B</td></tr></tbody></table></div></section></main></body></html>
